# Despliegue automático de la demo React a GitHub Pages.
# Se ejecuta en cada push a main, pero SOLO publica si lint + tests + build
# pasan en el propio job `build` (la calidad es puerta del despliegue).
# Para activarlo:
#   Settings → Pages → Source → GitHub Actions
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

# Sin permisos por defecto: cada job pide solo lo que necesita (más abajo).
# Declararlos aquí arriba se los daría también al job `build`, que es el que
# ejecuta código de terceros (pnpm install, vite, plugins). Si algo de eso
# estuviera comprometido, con pages:write podría publicar lo que quisiera.
permissions: {}

# Evita deploys simultáneos: si hay uno en curso y llega otro push,
# el nuevo espera a que termine el anterior. NO se cancela un deploy a
# medias: interrumpir la publicación en Pages puede dejarla inconsistente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # solo leer el repo; no puede publicar nada
    defaults:
      run:
        working-directory: demo  # la app React vive en demo/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El build no vuelve a usar git; no dejamos el token en .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0 # misma versión que en local, sin rango flotante

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # pnpm install --frozen-lockfile: instala exactamente lo que dice
      # pnpm-lock.yaml, sin modificarlo. Reproducible para CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Puerta de calidad: si lint o los tests fallan, el job muere aquí
      # y el job `deploy` (needs: build) no publica nada en Pages.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Vite genera el build de producción en demo/dist/.
      # La variable `base` en vite.config.js se encarga de prefijar las rutas
      # con /melanoma-detection-vgg16/ para que funcionen en GitHub Pages.
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Los permisos de publicación viven solo aquí, en el job que no ejecuta
    # ni instala nada: se limita a publicar el artefacto que produjo `build`.
    permissions:
      pages: write # publicar en GitHub Pages
      id-token: write # autenticación OIDC con Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
