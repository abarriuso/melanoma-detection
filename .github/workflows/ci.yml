# CI: valida cada push/PR antes de que llegue a main.
# Corre lint, tests unitarios y build de producción de la demo.
# El despliegue real a GitHub Pages vive en deploy.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0 # misma versión que en local, sin rango flotante

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift de notebooks (D1): los .ipynb versionados deben ser EXACTAMENTE
      # lo que genera scripts/gen-notebooks.mjs (su fuente de verdad).
      # Se regenera en un temporal y se compara byte a byte; no toca el repo.
      # entrenamiento_conjunto_kaggle.ipynb se mantiene a mano y no se comprueba.
      - name: Check notebooks match generator
        working-directory: ${{ github.workspace }}
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/notebooks"
          cd "$tmp"
          node "$GITHUB_WORKSPACE/scripts/gen-notebooks.mjs"
          for f in vgg16 resnet50v2 efficientnetv2s; do
            diff "$tmp/notebooks/$f.ipynb" "$GITHUB_WORKSPACE/notebooks/$f.ipynb"
          done

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
