<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- El grafo del modelo por defecto (EfficientNetV2S). Adelantarlo ahorra un
         round-trip: TF.js pide model.json antes de los shards de pesos. -->
    <link rel="preload" as="fetch" href="./model/efficientnetv2s/model.json" crossorigin />

    <!-- Content Security Policy se inyecta vía vite plugin (cspPlugin) según modo dev/prod -->
    <!-- Las tipografías (IBM Plex Sans / IBM Plex Mono) se auto-hostean vía
         @fontsource y se importan en src/main.jsx. Sin third-party fetches. -->
    <!-- Frame-buster: evita que GitHub Pages (u otro hosting estático sin
         headers HTTP) sea embebido en un iframe malicioso. Va en un fichero
         aparte, no inline, para que lo cubra `script-src 'self'` sin
         depender de dónde se inyecte el meta de la CSP. -->
    <script src="./frame-guard.js"></script>

    <title>Melanoma detection — EfficientNetV2S + TensorFlow.js</title>
    <meta
      name="description"
      content="Skin lesion analysis with a fine-tuned EfficientNetV2S (AUC 0.971). 100% client-side inference with TensorFlow.js. Not a medical device."
    />

    <!-- Open Graph. URLs absolutas (los crawlers no resuelven relativas). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abarriuso.github.io/melanoma-detection/" />
    <meta property="og:title" content="Melanoma detection" />
    <meta
      property="og:description"
      content="Fine-tuned EfficientNetV2S · AUC 0.971 · analysed in your browser, no data sent anywhere. Not a medical device."
    />
    <meta property="og:image" content="https://abarriuso.github.io/melanoma-detection/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Project summary: AUC 0.971, accuracy 87.1%, sensitivity 90.0%." />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Melanoma detection" />
    <meta
      name="twitter:description"
      content="Fine-tuned EfficientNetV2S · AUC 0.971 · analysed in your browser, no data sent anywhere."
    />
    <meta name="twitter:image" content="https://abarriuso.github.io/melanoma-detection/og.png" />

    <!-- JSON-LD para buscadores que entienden Schema.org. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Melanoma detection",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web Browser",
        "description": "Educational project that classifies skin lesions with deep learning (fine-tuned EfficientNetV2S). 100% client-side inference with TensorFlow.js. Not a medical device.",
        "url": "https://abarriuso.github.io/melanoma-detection/",
        "image": "https://abarriuso.github.io/melanoma-detection/og.png",
        "inLanguage": ["en", "es"],
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "Adrián Barriuso Pizarro",
          "url": "https://github.com/abarriuso"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:560px;margin:3rem auto;padding:1.5rem 0;color:#1c1a17;background:#f7f4ee;border-top:3px double rgba(28,26,23,0.32);border-bottom:1px solid rgba(28,26,23,0.14);font-family:'Segoe UI',system-ui,Arial,sans-serif;text-align:center">
        <h2 style="font-weight:600">JavaScript is turned off</h2>
        <p>The AI analysis runs <strong>directly in your browser</strong> with TensorFlow.js, so it needs JavaScript. / El análisis se ejecuta en tu navegador con TensorFlow.js y necesita JavaScript.</p>
        <p>Turn it on, or read the code on
          <a style="color:#0f5e5a" href="https://github.com/abarriuso/melanoma-detection">GitHub</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
